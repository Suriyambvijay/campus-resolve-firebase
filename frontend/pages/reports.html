<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reports | Campus Resolve</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet">
</head>
<body>
<div class="d-flex">
  <div id="sidebarMount"></div>
  <div class="main-cr">
    <div id="topbarMount"></div>

    <div class="cr-card p-4 mb-4">
      <h6 class="mb-3">Generate a New Report</h6>
      <p class="text-muted small">Reports are generated live from current complaint data. If there is not enough data for the period, the report will note that clearly.</p>
      <button class="btn btn-cr-primary me-2" id="genWeekly"><i class="bi bi-file-earmark-pdf"></i> Generate Weekly Report</button>
      <button class="btn btn-cr-outline" id="genMonthly"><i class="bi bi-file-earmark-pdf"></i> Generate Monthly Report</button>
    </div>

    <div class="cr-card p-4">
      <h6 class="mb-3">Report History</h6>
      <div id="reportsList"></div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script>
async function loadReports() {
  const { reports } = await Api.get('/reports');
  const el = document.getElementById('reportsList');
  if (reports.length === 0) { el.innerHTML = '<p class="text-muted small mb-0">No reports generated yet.</p>'; return; }
  el.innerHTML = `<div class="table-responsive"><table class="table align-middle">
    <thead class="table-light"><tr><th>Type</th><th>Period</th><th>Generated For</th><th>Generated At</th><th></th></tr></thead>
    <tbody>
    ${reports.map(r => `<tr>
      <td>${r.report_type}</td>
      <td>${formatDate(r.period_start)} – ${formatDate(r.period_end)}</td>
      <td>${r.generated_for}</td>
      <td>${formatDateTime(r.generated_at)}</td>
      <td><a href="${r.file_path}" target="_blank" class="btn btn-sm btn-cr-outline"><i class="bi bi-download"></i> Download</a></td>
    </tr>`).join('')}
    </tbody></table></div>`;
}

async function init() {
  const user = await requireAuth();
  if (!user) return;
  guardRole('hod', 'principal', 'admin');
  loadReports();
}
init();

document.getElementById('genWeekly').addEventListener('click', async (e) => {
  e.target.disabled = true;
  try {
    const res = await Api.get('/reports/weekly');
    showToast(res.message, 'success');
    loadReports();
  } catch (err) { showToast(err.message, 'error'); }
  e.target.disabled = false;
});

document.getElementById('genMonthly').addEventListener('click', async (e) => {
  e.target.disabled = true;
  try {
    const res = await Api.get('/reports/monthly');
    showToast(res.message, 'success');
    loadReports();
  } catch (err) { showToast(err.message, 'error'); }
  e.target.disabled = false;
});
</script>
</body>
</html>
