<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Users | Campus Resolve</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet">
</head>
<body>
<div class="d-flex">
  <div id="sidebarMount"></div>
  <div class="main-cr">
    <div id="topbarMount"></div>

    <div class="d-flex justify-content-between align-items-center mb-3">
      <div class="d-flex gap-2">
        <select id="fRole" class="form-select form-select-sm" style="width:160px">
          <option value="">All Roles</option>
          <option value="student">Student</option><option value="staff">Staff</option>
          <option value="coordinator">Coordinator</option><option value="hod">HOD</option>
          <option value="principal">Principal</option><option value="admin">Admin</option>
        </select>
        <input type="text" id="fSearch" class="form-control form-control-sm" placeholder="Search name/email" style="width:220px">
        <button class="btn btn-cr-outline btn-sm" id="applyFilter">Filter</button>
      </div>
      <button class="btn btn-cr-primary btn-sm" data-bs-toggle="modal" data-bs-target="#createUserModal"><i class="bi bi-person-plus"></i> Create User</button>
    </div>

    <div class="cr-card p-3" id="usersTableWrap"></div>
  </div>
</div>

<!-- Create User Modal -->
<div class="modal fade" id="createUserModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title">Create User</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <form id="createUserForm">
          <div class="mb-2"><label class="form-label">Full Name</label><input type="text" class="form-control" id="cFullName" required></div>
          <div class="mb-2"><label class="form-label">Email</label><input type="email" class="form-control" id="cEmail" required></div>
          <div class="mb-2"><label class="form-label">Temporary Password</label><input type="password" class="form-control" id="cPassword" minlength="8" required></div>
          <div class="mb-2"><label class="form-label">Role</label>
            <select class="form-select" id="cRole" required>
              <option value="coordinator">Coordinator</option><option value="hod">HOD</option>
              <option value="principal">Principal</option><option value="admin">Admin</option>
              <option value="staff">Staff</option><option value="student">Student</option>
            </select>
          </div>
          <div class="mb-2"><label class="form-label">Department</label><select class="form-select" id="cDept"><option value="">None</option></select></div>
          <button type="submit" class="btn btn-cr-primary w-100 mt-2">Create User</button>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script>
async function loadUsers() {
  const params = new URLSearchParams();
  if (document.getElementById('fRole').value) params.set('role', document.getElementById('fRole').value);
  if (document.getElementById('fSearch').value.trim()) params.set('search', document.getElementById('fSearch').value.trim());
  const { users } = await Api.get(`/admin/users?${params.toString()}`);
  const el = document.getElementById('usersTableWrap');
  el.innerHTML = `<div class="table-responsive"><table class="table align-middle">
    <thead class="table-light"><tr><th>Name</th><th>Email</th><th>Role</th><th>Department</th><th>Status</th><th></th></tr></thead>
    <tbody>${users.map(u => `<tr>
      <td>${escapeHtml(u.full_name)}</td><td>${escapeHtml(u.email)}</td>
      <td><span class="badge bg-secondary">${u.role}</span></td>
      <td>${escapeHtml(u.department_name || '—')}</td>
      <td><span class="badge ${u.status === 'active' ? 'bg-success' : 'bg-danger'}">${u.status}</span></td>
      <td><button class="btn btn-sm btn-cr-outline toggleStatusBtn" data-id="${u.id}" data-status="${u.status}">${u.status === 'active' ? 'Deactivate' : 'Activate'}</button></td>
    </tr>`).join('')}</tbody></table></div>`;

  document.querySelectorAll('.toggleStatusBtn').forEach(btn => btn.addEventListener('click', async () => {
    const newStatus = btn.dataset.status === 'active' ? 'inactive' : 'active';
    await Api.patch(`/admin/users/${btn.dataset.id}/status`, { status: newStatus });
    showToast('User status updated.', 'success');
    loadUsers();
  }));
}

async function init() {
  const user = await requireAuth();
  if (!user) return;
  guardRole('admin');
  const { departments } = await Api.get('/admin/departments');
  document.getElementById('cDept').innerHTML += departments.map(d => `<option value="${d.id}">${escapeHtml(d.department_name)}</option>`).join('');
  loadUsers();
}
init();

document.getElementById('applyFilter').addEventListener('click', loadUsers);

document.getElementById('createUserForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  try {
    await Api.post('/admin/users', {
      full_name: document.getElementById('cFullName').value.trim(),
      email: document.getElementById('cEmail').value.trim(),
      password: document.getElementById('cPassword').value,
      role: document.getElementById('cRole').value,
      department_id: document.getElementById('cDept').value || null
    });
    showToast('User created successfully.', 'success');
    bootstrap.Modal.getInstance(document.getElementById('createUserModal')).hide();
    document.getElementById('createUserForm').reset();
    loadUsers();
  } catch (err) { showToast(err.message, 'error'); }
});
</script>
</body>
</html>
