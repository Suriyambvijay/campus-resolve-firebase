<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Departments & Categories | Campus Resolve</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet">
</head>
<body>
<div class="d-flex">
  <div id="sidebarMount"></div>
  <div class="main-cr">
    <div id="topbarMount"></div>

    <div class="row g-4">
      <div class="col-md-6">
        <div class="cr-card p-4">
          <div class="d-flex justify-content-between mb-3"><h6 class="mb-0">Departments</h6></div>
          <form id="addDeptForm" class="d-flex gap-2 mb-3">
            <input type="text" class="form-control" id="newDeptName" placeholder="New department name" required>
            <button class="btn btn-cr-primary">Add</button>
          </form>
          <div id="deptList"></div>
        </div>
      </div>
      <div class="col-md-6">
        <div class="cr-card p-4">
          <div class="d-flex justify-content-between mb-3"><h6 class="mb-0">Categories</h6></div>
          <form id="addCatForm" class="d-flex gap-2 mb-3">
            <input type="text" class="form-control" id="newCatName" placeholder="New category name" required>
            <button class="btn btn-cr-primary">Add</button>
          </form>
          <div id="catList"></div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script>
async function loadDepts() {
  const { departments } = await Api.get('/admin/departments');
  document.getElementById('deptList').innerHTML = departments.map(d => `
    <div class="d-flex justify-content-between align-items-center border-bottom py-2">
      <div><strong>${escapeHtml(d.department_name)}</strong><br><small class="text-muted">HOD: ${escapeHtml(d.hod_name || 'Not assigned')}</small></div>
      <span class="badge ${d.status === 'active' ? 'bg-success' : 'bg-secondary'}">${d.status}</span>
    </div>`).join('');
}

async function loadCats() {
  const { categories } = await Api.get('/admin/categories');
  document.getElementById('catList').innerHTML = categories.map(c => `
    <div class="d-flex justify-content-between align-items-center border-bottom py-2">
      <div><strong>${escapeHtml(c.category_name)}</strong><br><small class="text-muted">${escapeHtml(c.description || '')}</small></div>
      <span class="badge ${c.status === 'active' ? 'bg-success' : 'bg-secondary'}">${c.status}</span>
    </div>`).join('');
}

async function init() {
  const user = await requireAuth();
  if (!user) return;
  guardRole('admin');
  loadDepts(); loadCats();
}
init();

document.getElementById('addDeptForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  try {
    await Api.post('/admin/departments', { department_name: document.getElementById('newDeptName').value.trim() });
    document.getElementById('newDeptName').value = '';
    showToast('Department added.', 'success');
    loadDepts();
  } catch (err) { showToast(err.message, 'error'); }
});

document.getElementById('addCatForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  try {
    await Api.post('/admin/categories', { category_name: document.getElementById('newCatName').value.trim() });
    document.getElementById('newCatName').value = '';
    showToast('Category added.', 'success');
    loadCats();
  } catch (err) { showToast(err.message, 'error'); }
});
</script>
</body>
</html>
