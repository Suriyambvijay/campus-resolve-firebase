<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notifications | Campus Resolve</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet">
</head>
<body>
<div class="d-flex">
  <div id="sidebarMount"></div>
  <div class="main-cr">
    <div id="topbarMount"></div>
    <div class="d-flex justify-content-end mb-3">
      <button class="btn btn-cr-outline btn-sm" id="markAllBtn"><i class="bi bi-check2-all"></i> Mark all as read</button>
    </div>
    <div class="cr-card p-3" id="notifList"></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script>
const TYPE_ICON = { success: ['bi-check-circle-fill', 'text-success'], warning: ['bi-exclamation-triangle-fill', 'text-warning'], info: ['bi-info-circle-fill', 'text-primary'] };

async function loadNotifications() {
  const { notifications } = await Api.get('/notifications');
  const el = document.getElementById('notifList');
  if (notifications.length === 0) { el.innerHTML = '<div class="text-center text-muted py-5"><i class="bi bi-bell-slash fs-1"></i><p class="mt-2">No notifications yet.</p></div>'; return; }

  el.innerHTML = notifications.map(n => {
    const [icon, cls] = TYPE_ICON[n.type] || TYPE_ICON.info;
    return `<div class="d-flex gap-3 py-3 border-bottom ${n.is_read ? '' : 'bg-light'}" data-id="${n.id}">
      <i class="bi ${icon} ${cls} fs-5 mt-1"></i>
      <div class="flex-grow-1">
        <div class="d-flex justify-content-between">
          <strong class="small">${escapeHtml(n.title)}</strong>
          <small class="text-muted">${formatDateTime(n.created_at)}</small>
        </div>
        <p class="small mb-0 text-muted">${escapeHtml(n.message)}</p>
        ${n.complaint_id ? `<a href="complaint-details.html?id=${n.complaint_id}" class="small">View complaint ${escapeHtml(n.complaint_code || '')}</a>` : ''}
      </div>
      ${!n.is_read ? `<button class="btn btn-sm btn-link markReadBtn">Mark read</button>` : ''}
    </div>`;
  }).join('');

  document.querySelectorAll('.markReadBtn').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      const id = e.target.closest('[data-id]').dataset.id;
      await Api.patch(`/notifications/${id}/read`);
      loadNotifications();
    });
  });
}

document.getElementById('markAllBtn').addEventListener('click', async () => {
  await Api.patch('/notifications/read-all');
  loadNotifications();
});

async function init() {
  const user = await requireAuth();
  if (!user) return;
  loadNotifications();
}
init();
</script>
</body>
</html>
