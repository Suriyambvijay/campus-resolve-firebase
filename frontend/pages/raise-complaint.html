<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raise a Concern | Campus Resolve</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet">
</head>
<body>
<div class="d-flex">
  <div id="sidebarMount"></div>
  <div class="main-cr">
    <div id="topbarMount"></div>

    <div class="cr-card p-4 mb-4" id="formCard">
      <h5 class="mb-1">Raise a Concern</h5>
      <p class="text-muted small mb-4"><i class="bi bi-info-circle"></i> Please provide factual and respectful information relevant to the concern being reported.</p>

      <form id="complaintForm" enctype="multipart/form-data">
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Complaint Category</label>
            <select class="form-select" id="category_id" required><option value="">Select Category</option></select>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">Department</label>
            <select class="form-select" id="department_id"><option value="">Select Department</option></select>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label">Complaint Title</label>
          <input type="text" class="form-control" id="title" maxlength="200" required placeholder="Brief title of your concern">
        </div>
        <div class="mb-3">
          <label class="form-label">Detailed Description</label>
          <textarea class="form-control" id="description" rows="4" required placeholder="Describe the concern in detail..."></textarea>
        </div>
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Location</label>
            <input type="text" class="form-control" id="location" placeholder="e.g. Block A, Room 204">
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">Priority</label>
            <select class="form-select" id="priority" required>
              <option value="Low">Low</option>
              <option value="Medium" selected>Medium</option>
              <option value="High">High</option>
              <option value="Critical">Critical</option>
            </select>
          </div>
        </div>
        <div class="mb-4">
          <label class="form-label">Supporting Image / File (optional)</label>
          <input type="file" class="form-control" id="attachment" accept=".jpg,.jpeg,.png,.webp,.pdf">
          <small class="text-muted">JPG, PNG, WEBP or PDF, up to 5MB.</small>
        </div>
        <button type="submit" class="btn btn-cr-primary px-4 py-2" id="submitBtn">SUBMIT CONCERN</button>
      </form>
    </div>

    <div class="cr-card p-4 d-none" id="successCard">
      <div class="text-center">
        <i class="bi bi-check-circle-fill fs-1" style="color:var(--cr-green)"></i>
        <h5 class="mt-3">Your concern has been submitted successfully.</h5>
        <div class="row justify-content-center mt-4">
          <div class="col-md-8">
            <div class="d-flex justify-content-between border-bottom py-2"><span class="text-muted">Complaint ID</span><strong id="resCode"></strong></div>
            <div class="d-flex justify-content-between border-bottom py-2"><span class="text-muted">Status</span><strong id="resStatus"></strong></div>
            <div class="d-flex justify-content-between py-2"><span class="text-muted">Expected Resolution Period</span><strong id="resDeadline"></strong></div>
          </div>
        </div>
        <a href="my-complaints.html" class="btn btn-cr-primary mt-4">View My Complaints</a>
        <button class="btn btn-cr-outline mt-4 ms-2" onclick="location.reload()">Raise Another Concern</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script>
async function init() {
  const user = await requireAuth();
  if (!user) return;
  guardRole('student', 'staff');

  const [{ categories }, { departments }] = await Promise.all([Api.get('/public/categories'), Api.get('/public/departments')]);
  document.getElementById('category_id').innerHTML += categories.map(c => `<option value="${c.id}">${escapeHtml(c.category_name)}</option>`).join('');
  document.getElementById('department_id').innerHTML += departments.map(d => `<option value="${d.id}" ${d.id === user.department_id ? 'selected' : ''}>${escapeHtml(d.department_name)}</option>`).join('');
}
init();

document.getElementById('complaintForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = 'Submitting...';

  const formData = new FormData();
  formData.append('category_id', document.getElementById('category_id').value);
  formData.append('department_id', document.getElementById('department_id').value);
  formData.append('title', document.getElementById('title').value.trim());
  formData.append('description', document.getElementById('description').value.trim());
  formData.append('location', document.getElementById('location').value.trim());
  formData.append('priority', document.getElementById('priority').value);
  const file = document.getElementById('attachment').files[0];
  if (file) formData.append('attachment', file);

  try {
    const { complaint } = await Api.post('/complaints', formData, true);
    document.getElementById('formCard').classList.add('d-none');
    document.getElementById('successCard').classList.remove('d-none');
    document.getElementById('resCode').textContent = complaint.complaint_code;
    document.getElementById('resStatus').textContent = complaint.status;
    document.getElementById('resDeadline').textContent = formatDate(complaint.deadline);
    showToast('Your concern has been submitted successfully.', 'success');
  } catch (err) {
    showToast(err.message, 'error');
    btn.disabled = false; btn.textContent = 'SUBMIT CONCERN';
  }
});
</script>
</body>
</html>
